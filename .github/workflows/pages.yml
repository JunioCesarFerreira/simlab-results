name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy in flight is never cancelled: the published archive should not be
# left half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # The site is served straight from the repository: the viewer has no
      # build step, and data/ and raw/ are committed artifacts.
      #
      # This step fails with "Get Pages site failed ... Not Found" until Pages
      # is enabled for the repository under Settings > Pages, with Source set
      # to "GitHub Actions". configure-pages can do that itself via its
      # "enablement" input, but only with a PAT — that input does not work with
      # the default GITHUB_TOKEN.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
